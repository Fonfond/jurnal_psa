# Content-Security-Policy for the Logbook SPA (AUTH-05).
# 'unsafe-inline' in style-src is required by React inline style attributes;
# scripts are self-hosted only (no eval/inline), workers are limited to self/blob.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
