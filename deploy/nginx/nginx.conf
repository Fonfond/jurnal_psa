# Logbook production nginx (AUTH-05, ADR-14).
#
# TLS termination, HSTS + CSP + security headers, edge rate limiting and
# separation of the operational and admin origins. The API stays on loopback;
# nginx is the only public entry point.
#
# Paths are production defaults:
#   certificates: /etc/nginx/certs/logbook.crt|key
#   web build:    /var/www/logbook (apps/web/dist)
# Local syntax check: scripts/security/verify-nginx.ps1 (rewrites paths).

worker_processes auto;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    server_names_hash_bucket_size 64;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log logs/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 4m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Edge rate limiting (AUTH-04). The API also enforces per-process limits;
    # nginx covers all instances and slows brute force before it reaches Node.
    limit_req_zone $binary_remote_addr zone=logbook_api:16m rate=300r/m;
    limit_req_zone $binary_remote_addr zone=logbook_auth:16m rate=20r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=logbook_conn:10m;

    upstream logbook_api {
        server 127.0.0.1:3001;
        keepalive 32;
    }

    # Plain HTTP is only a redirect; HSTS is set on HTTPS responses.
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Operational SPA + API.
    server {
        listen 443 ssl;
        http2 on;
        server_name logbook.example.com;

        ssl_certificate     /etc/nginx/certs/logbook.crt;
        ssl_certificate_key /etc/nginx/certs/logbook.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        root /var/www/logbook;
        index index.html;

        include security-headers.conf;

        # Authentication endpoints: strict edge limit + no buffering of secrets.
        location /v1/auth/ {
            limit_req zone=logbook_auth burst=10 nodelay;
            limit_conn logbook_conn 20;
            proxy_pass http://logbook_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
            proxy_request_buffering off;
        }

        # API: general limit, no caching, generous but bounded timeouts.
        location /v1/ {
            limit_req zone=logbook_api burst=100 nodelay;
            limit_conn logbook_conn 50;
            proxy_pass http://logbook_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering off;
        }

        # Hashed build assets may be cached forever, but keep the security
        # headers (a location with add_header does not inherit server headers).
        location ~* ^/assets/.*\.(?:js|css|svg|png|webp|woff2?|map)$ {
            include security-headers.conf;
            include spa-csp.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location = /index.html {
            include security-headers.conf;
            include spa-csp.conf;
            add_header Cache-Control "no-store" always;
        }

        location = /sw.js {
            include security-headers.conf;
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        location = /service-worker.js {
            include security-headers.conf;
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        # SPA fallback (React Router history).
        location / {
            include security-headers.conf;
            include spa-csp.conf;
            add_header Cache-Control "no-store" always;
            try_files $uri /index.html;
        }
    }

    # Separate admin origin (ADR-14): same build, admin routes, own cookie jar.
    server {
        listen 443 ssl;
        http2 on;
        server_name admin.logbook.example.com;

        ssl_certificate     /etc/nginx/certs/logbook.crt;
        ssl_certificate_key /etc/nginx/certs/logbook.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        root /var/www/logbook;
        index index.html;

        include security-headers.conf;

        location = / {
            return 302 /admin/;
        }

        location /v1/auth/ {
            limit_req zone=logbook_auth burst=10 nodelay;
            limit_conn logbook_conn 20;
            proxy_pass http://logbook_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_request_buffering off;
        }

        location /v1/ {
            limit_req zone=logbook_api burst=100 nodelay;
            limit_conn logbook_conn 50;
            proxy_pass http://logbook_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        location /admin/ {
            include security-headers.conf;
            include spa-csp.conf;
            add_header Cache-Control "no-store" always;
            try_files $uri /index.html;
        }

        location / {
            include security-headers.conf;
            include spa-csp.conf;
            add_header Cache-Control "no-store" always;
            try_files $uri /index.html;
        }
    }
}
