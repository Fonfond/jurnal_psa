<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logbook — офлайн</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #f8fafc;
        font-family: 'Segoe UI', system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 20px;
        padding: 28px;
      }
      .mark {
        display: inline-grid;
        place-items: center;
        width: 58px;
        height: 58px;
        border-radius: 16px;
        background: linear-gradient(135deg, #14b8a6, #0f766e);
        font-weight: 800;
        font-size: 15px;
        margin-bottom: 16px;
      }
      h1 { font-size: 22px; margin: 0 0 10px; }
      p { color: #cbd5e1; font-size: 14px; line-height: 1.5; margin: 0 0 18px; }
      a {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 10px;
        background: #14b8a6;
        color: #042f2e;
        font-weight: 700;
        text-decoration: none;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">ЭОЖ</div>
      <h1>Нет соединения</h1>
      <p>
        Logbook работает офлайн. Откройте приложение — сохранённые записи
        доступны из локальной базы, отправка возобновится при подключении.
      </p>
      <a href="/">Открыть журнал</a>
    </div>
  </body>
</html>
